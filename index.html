<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Únete a un grupo en Claras</title>
  <meta name="description" content="Te invitaron a un grupo en Claras para repartir gastos sin enredos." />
  <meta property="og:title" content="Te invitaron a un grupo en Claras" />
  <meta property="og:description" content="Toca para entrar al grupo y repartir los gastos." />
  <meta name="theme-color" content="#C75432" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #C75432;
      --primary-dark: #A8431F;
      --cream: #FBF6F1;
      --surface: #FFFFFF;
      --ink: #2B2018;
      --muted: #8A7C70;
      --soft: #F3E7DD;
      --wa: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--surface);
      border-radius: 28px;
      padding: 40px 28px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 50px rgba(120, 60, 30, 0.14);
      border: 1px solid var(--soft);
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .emoji { font-size: 52px; line-height: 1; margin: 8px 0 18px; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    p.sub { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin-bottom: 24px; }
    .code-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .code {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 34px;
      color: var(--primary);
      letter-spacing: 3px;
      background: var(--soft);
      border-radius: 14px;
      padding: 12px 0;
      margin-bottom: 26px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .08s ease, filter .12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(199,84,50,.32); }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-store { background: var(--ink); color: #fff; margin-top: 12px; }
    .btn-copy { background: var(--soft); color: var(--primary-dark); padding: 12px; font-size: 15px; margin: -14px 0 24px; }
    .web-link { display: block; margin-top: 14px; color: var(--muted); font-size: 14px; font-weight: 500; }
    .hint { color: var(--muted); font-size: 12.5px; margin-top: 22px; line-height: 1.5; }
    .footer { color: var(--muted); font-size: 11.5px; margin-top: 18px; opacity: .8; }
    .legal { font-size: 11.5px; margin-top: 8px; }
    .legal a { color: var(--muted); font-weight: 500; }
    .btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 1024 1024" width="104" height="104" style="margin:6px auto 18px; display:block;" aria-label="Claras">
      <rect width="1024" height="1024" rx="224" fill="#C75432"/>
      <path d="M 380 232 H 644 a 36 36 0 0 1 36 36 V 672 l -28 38 -28 -38 -28 38 -28 -38 -28 38 -28 -38 -28 38 -28 -38 -28 38 -28 -38 -28 38 -28 -38 V 268 a 36 36 0 0 1 36 -36 Z" fill="#FBF6F1"/>
      <rect x="392" y="300" width="240" height="30" rx="15" fill="#C75432"/>
      <rect x="392" y="356" width="168" height="30" rx="15" fill="#F0855B"/>
      <rect x="503" y="420" width="18" height="216" rx="9" fill="#C75432"/>
      <path d="M 576 462 C 576 438 548 428 512 428 C 472 428 448 446 448 478 C 448 506 476 518 512 528 C 548 538 576 550 576 580 C 576 610 548 624 512 624 C 474 624 448 612 444 584" fill="none" stroke="#C75432" stroke-width="32" stroke-linecap="round"/>
    </svg>
    <div class="logo">Claras<span style="color:var(--primary)">.</span></div>
    <h1 id="titulo">Te invitaron a un grupo</h1>
    <p class="sub" id="sub">Entra para repartir los gastos sin enredos, en pesos y sin crear cuentas.</p>

    <div id="codeBox" style="display:none">
      <div class="code-label">Tu código</div>
      <div class="code" id="code"></div>
      <button class="btn btn-copy" id="copyBtn" type="button" style="display:none">Copiar código</button>
    </div>

    <!-- Sin JavaScript, el botón lleva a la versión web, que sirve en cualquier teléfono. -->
    <a class="btn btn-primary" id="openBtn" href="https://app.clarasapp.com/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span id="openLabel">Abrir Claras</span>
    </a>

    <a class="btn btn-store" id="storeBtn" href="https://play.google.com/store/apps/details?id=com.jcandrade.cuentas_claras" style="display:none">
      Descargar Claras
    </a>

    <a class="web-link" id="webLink" href="https://app.clarasapp.com/" style="display:none">o úsala en el navegador</a>

    <p class="hint" id="hint"></p>
    <p class="footer">Claras · cuentas claras, amistades largas</p>
    <p class="legal"><a href="privacidad.html">Privacidad</a> · <a href="eliminar-cuenta.html">Eliminar cuenta</a></p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get('c') || params.get('code') || '').trim().toUpperCase();
      var ua = navigator.userAgent || '';
      var esAndroid = /Android/i.test(ua);
      // iPadOS se presenta como Mac; se distingue porque tiene pantalla táctil.
      var esIOS = /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var web = 'https://app.clarasapp.com/' + (code ? '?c=' + encodeURIComponent(code) : '');
      var deepLink = code ? 'claras://join/' + encodeURIComponent(code) : 'claras://join';
      function $(id) { return document.getElementById(id); }

      if (code) {
        $('code').textContent = code;
        $('codeBox').style.display = 'block';
      } else {
        // Visita a clarasapp.com sin invitación: portada en vez de "te invitaron".
        $('titulo').textContent = 'Reparte gastos sin enredos';
        $('sub').textContent = 'Claras divide los gastos de viajes, roomies y planes, en pesos y sin crear cuentas.';
      }

      if (esAndroid) {
        // La app abre claras://join/CODIGO; si no está instalada, queda la tienda
        // y la versión web (mientras Claras no esté en producción, Play solo deja
        // instalarla a los testers).
        $('openLabel').textContent = 'Abrir en Claras';
        $('openBtn').setAttribute('href', deepLink);
        $('openBtn').addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = deepLink;
        });
        $('storeBtn').style.display = 'flex';
        $('webLink').setAttribute('href', web);
        $('webLink').style.display = 'block';
        if (code) {
          $('hint').textContent = '¿No se abrió? Instala Claras y vuelve a tocar el enlace. Tu código quedará listo.';
          // Intento automático: si la app está instalada, Android cambia a Claras.
          setTimeout(function () { window.location.href = deepLink; }, 600);
        }
      } else {
        // iPhone y computador: no hay app que abrir (claras:// da error en Safari),
        // así que el botón entra a la versión web con el código ya puesto.
        $('openBtn').setAttribute('href', web);
        if (code) $('copyBtn').style.display = 'flex';
        $('hint').textContent = esIOS
            ? (code ? '¿Ya usas Claras desde la pantalla de inicio? Ábrela, toca "Unirse con código" y pega el código.' : '')
            : 'Claras funciona en el navegador. En Android también puedes instalar la app.';
      }

      $('copyBtn').addEventListener('click', function () {
        function copiado() { $('copyBtn').textContent = 'Código copiado'; }
        function seleccionar() {
          var r = document.createRange();
          r.selectNodeContents($('code'));
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(copiado, seleccionar);
        } else {
          seleccionar();
        }
      });
    })();
  </script>
</body>
</html>
